# Compila o APK de depuração e roda os testes no GitHub Actions (nos servidores do GitHub,
# onde o Google Maven e o Android SDK estão disponíveis).
#
# - A cada push ou pull request: testes do núcleo + APK debug (baixe em "Artifacts").
# - Testes de interface num emulador: rodam a cada push na main ou manualmente
#   ("Run workflow" na aba Actions).
name: Android

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Testes do núcleo e APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Testes do núcleo
        run: ./gradlew -p core test

      - name: Resumo das falhas do núcleo
        if: failure()
        run: python3 .github/scripts/junit_annotations.py core/build/test-results

      - name: Compilar APK de depuração
        run: ./gradlew :app:assembleDebug

      - name: Publicar APK
        uses: actions/upload-artifact@v4
        with:
          name: vrumgrid-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Publicar relatórios de teste
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: relatorios-testes-nucleo
          path: core/build/reports/tests/
          if-no-files-found: ignore

  ui-tests:
    name: Testes de interface (emulador)
    needs: build
    if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Habilitar KVM (aceleração do emulador)
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Rodar testes no emulador
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          # O emulator-runner executa cada linha com sh; a saída e o logcat ficam em arquivos
          # para o passo seguinte resumir as falhas como anotações.
          script: |
            adb logcat -c || true
            timeout 25m ./gradlew :app:connectedDebugAndroidTest > ui-test.log 2>&1 || (adb logcat -d > logcat.txt; tail -n 200 ui-test.log; exit 1)

      - name: Resumo das falhas
        if: failure() || cancelled()
        run: |
          python3 .github/scripts/junit_annotations.py app/build/outputs/androidTest-results
          python3 .github/scripts/log_annotations.py ui-test.log logcat.txt

      - name: Publicar relatórios
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: relatorios-testes-interface
          path: app/build/reports/androidTests/
          if-no-files-found: ignore
